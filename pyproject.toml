[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rexha"
version = "0.1.0"
description = "Persistent, voice-enabled, AI-assisted Windows desktop automation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "psutil>=5.9.0",
    "pydantic>=2.5.0",
]

[project.scripts]
rexha = "rexha.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"
